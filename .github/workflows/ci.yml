# Lo mismo que se corre en local antes de dar algo por terminado: pytest en api/
# contra un Postgres con pgvector, y npm run build en web/. Sin Ollama: los tests
# no llaman al modelo. Sin datos reales: los fixtures son sintéticos.
# Y que las imágenes de docker-compose.yml se construyan.
name: ci

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: libro
          POSTGRES_PASSWORD: libro
          POSTGRES_DB: libro_mayor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U libro -d libro_mayor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
        working-directory: api
      - run: pytest
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
