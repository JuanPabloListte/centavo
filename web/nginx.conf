# Sirve la interfaz compilada y le pasa /api a la API por la red interna de
# Compose. El navegador le habla a un solo origen, igual que con el proxy de Vite.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Un resumen puede pesar varios MB. La API corta en 20 y dice por qué: acá
    # el límite va un poco más arriba para que la respuesta sea la de la API.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # El progreso de una carga llega por SSE: sin buffer, cada evento pasa
        # apenas sale de la API.
        proxy_buffering off;
        # Una carga con la flota de modelos tarda minutos.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
