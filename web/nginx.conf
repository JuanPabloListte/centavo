# Sirve la interfaz compilada y le pasa /api a la API por la red interna de
# Compose. El navegador le habla a un solo origen, igual que con el proxy de Vite.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Una ingesta con la flota de modelos tarda minutos.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
